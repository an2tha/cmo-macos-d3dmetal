name: Build CommandMetal

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test installer and packaging
        run: python -m unittest discover -s tests -v
      - name: Build and package
        run: python scripts/build.py
      - name: Verify executable starts without game files
        shell: pwsh
        run: |
          & ./dist/CommandMetal/CommandMetal.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'CommandMetal version check failed.' }
          $assembly = [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path './dist/CommandMetal/CommandMetal.exe'))
          if ($assembly.Name -ne 'CommandMetal') { throw 'Unexpected assembly identity.' }
      - name: Upload executable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CommandMetal-win-x64
          path: dist/CommandMetal-win-x64.zip
          if-no-files-found: error
          retention-days: 30
